name: Build APK + Update Bundle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Stamp version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "window.APP_VERSION = '$VERSION';" > www/js/version.js
          cat www/js/version.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force copy data
        run: |
          mkdir -p android/app/src/main/assets/public/data
          cp -v www/data/*.js android/app/src/main/assets/public/data/ 2>/dev/null || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --init-script init.gradle \
            -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ env.VERSION }} 2>&1 | tail -300

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk libya-quran.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: libya-quran-apk
          path: libya-quran.apk
          if-no-files-found: error

      - name: Build Update Bundle
        run: |
          cd www
          zip -r ../bundle.zip . -q
          cd ..
          ls -lh bundle.zip
          CHECKSUM=$(sha256sum bundle.zip | cut -d' ' -f1)
          cat > update.json << JSONEOF
          {
            "version": "$VERSION",
            "url": "https://github.com/abdo15542/libya-quran-app/releases/download/latest/bundle.zip",
            "checksum": "$CHECKSUM"
          }
          JSONEOF
          cat update.json

      - name: Delete old latest release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "أحدث إصدار — ${{ env.VERSION }}"
          body: |
            📱 حمّل libya-quran.apk وثبّته على أندرويد.
            الإصدار: ${{ env.VERSION }}
          files: |
            libya-quran.apk
            bundle.zip
            update.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
