name: Build APK + Update Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force copy data
        run: |
          mkdir -p android/app/src/main/assets/public/data
          cp -v www/data/*.js android/app/src/main/assets/public/data/ 2>/dev/null || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -300

      - name: Build Update Bundle
        run: |
          cd www
          zip -r ../bundle.zip . -q
          cd ..
          ls -lh bundle.zip
          CHECKSUM=$(sha256sum bundle.zip | cut -d' ' -f1)
          VERSION="1.0.${{ github.run_number }}"
          cat > update.json << JSONEOF
          {
            "version": "$VERSION",
            "url": "https://github.com/abdo15542/libya-quran-app/releases/download/latest/bundle.zip",
            "checksum": "$CHECKSUM"
          }
          JSONEOF
          cat update.json
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Delete old latest release
        continue-on-error: true
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "أحدث إصدار — ${{ env.VERSION }}"
          body: |
            🎉 تحديث تلقائي جديد
            الإصدار: ${{ env.VERSION }}
          files: |
            bundle.zip
            update.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: libya-quran-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
