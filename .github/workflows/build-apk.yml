name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Verify web assets copied
        run: |
          echo "=== www/ ==="
          ls -la www/
          echo "=== www/data/ ==="
          ls -la www/data/
          echo "=== android assets (المصدر الرئيسي للـ APK) ==="
          ls -la android/app/src/main/assets/public/ || echo "المجلد غير موجود!"
          echo "=== android assets/data ==="
          ls -la android/app/src/main/assets/public/data/ || echo "مجلد data غير موجود!"
          echo "=== الحجم الإجمالي للأصول ==="
          du -sh android/app/src/main/assets/public/ || echo "غير موجود"

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -500

      - name: Verify APK exists
        run: |
          echo "=== البحث عن APK ==="
          find android -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "مجلد APK غير موجود"
          ls -la android/app/build/ 2>/dev/null || echo "مجلد build غير موجود"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libya-quran-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
