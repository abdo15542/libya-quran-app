name: Build Wird Android APK

on:
  push:
    branches: [wird-android-offline]
    paths:
      - "wird-android/**"
      - ".github/workflows/wird-android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "wird-android/**"
      - ".github/workflows/wird-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wird-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch and validate Tanzil Quran text
        working-directory: wird-android
        run: |
          python3 tools/fetch_quran.py
          python3 tools/validate_quran.py
          python3 tools/fetch_mushaf_pages.py
          python3 tools/validate_mushaf_pages.py
          python3 tools/validate_project.py
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: wird-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wird-debug-APK
          path: wird-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
