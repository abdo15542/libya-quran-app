<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a3d2c">
  <title>مصحف ليبيا — رواية قالون</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-content">
      <div class="splash-logo">﷽</div>
      <h1>مصحف ليبيا</h1>
      <p>رواية قالون عن نافع</p>
      <div id="loading-status" class="loading-status">جاري التحميل...</div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn">☰</button>
      <h1 class="app-title">مصحف ليبيا</h1>
      <button id="theme-btn" class="icon-btn">🌙</button>
    </header>

    <main id="reader" class="reader">
      <div class="surah-info">
        <h2 id="surah-title">سورة الفاتحة</h2>
        <span id="page-info">صفحة 1</span>
      </div>
      <div id="verses-container" class="verses-container"></div>
      <div class="bottom-nav">
        <button id="prev-btn" class="nav-btn">◀ السابق</button>
        <button id="play-btn" class="nav-btn play-btn">▶ تشغيل</button>
        <button id="next-btn" class="nav-btn">التالي ▶</button>
      </div>
    </main>

    <nav id="sidebar" class="sidebar">
      <h3>القرآن الكريم</h3>
      <input id="search-input" type="text" placeholder="ابحث عن سورة..." class="search-input" />
      <ul id="surah-list" class="surah-list"></ul>
    </nav>

    <div id="toolbar" class="toolbar">
      <button data-action="tafseer">📖 تفسير</button>
      <button data-action="translate">🌐 ترجمة</button>
      <button data-action="bookmark">🔖 علامات</button>
      <button data-action="note">📝 ملاحظة</button>
      <button data-action="settings">⚙️ إعدادات</button>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">✕</button>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
